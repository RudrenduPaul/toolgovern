name: Publish npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm 11.5.1 or newer (required for Trusted Publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Each step publishes only when its name@version is missing from the
      # registry, so a release that changes some packages does not fail on
      # the ones left at a previously published version. Core package first:
      # toolgovern-cli depends on it.
      - name: Publish toolgovern
        working-directory: packages/toolgovern
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is on the registry, skipping"
          else
            npm publish --access public
          fi

      - name: Publish toolgovern-cli
        working-directory: packages/toolgovern-cli
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is on the registry, skipping"
          else
            npm publish --access public
          fi

      - name: Publish toolgovern-integration-langgraph
        working-directory: integrations/langgraph
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is on the registry, skipping"
          else
            npm publish --access public
          fi

      - name: Publish toolgovern-integration-oma
        working-directory: integrations/oma
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is on the registry, skipping"
          else
            npm publish --access public
          fi
